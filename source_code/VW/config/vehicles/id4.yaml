# Option sets for the Volkswagen ID.4: what each year range can have.
# Drafted 2026-10-26 from datasets/vw_models_data.csv (model years 2020+), one set per
# run of consecutive years with identical options. Review before relying on it.
# Rules: values are normalized keyword values (keywords.yaml); a category that is not
# listed means "not offered"; years are inclusive; inventory status is never an option.

make: Volkswagen
model: ID.4

# drafted = built from the VW export, not yet checked by a person; set reviewed (with who / when) once checked
status: drafted
reviewed_by:
reviewed_on:

option_sets:
  # --- ID.4 (base)
  - years: [2021, 2022]
    trim: [PRO]
    drivetrain: [AWD, RWD]

  - years: [2023, 2023]
    trim: [PRO]
    drivetrain: [AWD, RWD]
    battery_supplier: [LG Energy Solution, SK On]

  - years: [2024, 2024]
    trim: [PRO, PRO S, S]
    drivetrain: [AWD]

  - years: [2025, 2025]
    trim: [PRO, PRO S]
    drivetrain: [AWD]

verified:
  # --- the vehicle didn't exist in those years (the years must NOT be in option_sets)
  - never_offered:
      years: [2026]
    reason: Not offered in Canada this year (2026)
    verified_by: P.M
    verified_on: 2026-10-29