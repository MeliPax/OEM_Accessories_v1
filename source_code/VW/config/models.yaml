# VOCABULARY: the make, its models and their submodels.
#
# A description must start with a model name; a submodel name may follow it directly
# ("Golf GTI ...", "Atlas Cross Sport ..."). Names are matched whole-word, case-insensitive,
# longest first, so "Golf R" never matches "Golf R-Line".
#
# series is optional and future-facing: filled only where a consistent strategy exists today
# (Golf GTI / R = Performance, Alltrack = Adventure); everything else stays null.

make: Volkswagen

models:
  Arteon: {}
  Atlas:
    submodels:
      Cross Sport: {}
  Beetle: {}
  e-Golf: {}
  Golf:
    submodels:
      GTI: { series: Performance }
      R: { series: Performance }
      Alltrack: { series: Adventure }
      SportWagen: {}
  ID. Buzz: {}
  ID.4: {}
  Jetta:
    submodels:
      GLI: {}
  Passat: {}
  Taos: {}
  Tiguan: {}

# Alternate spellings -> the standard name. One list shared by every dataset (VW models and accessories),
# so both produce the same standard names. Applied while cleaning, before parsing; whole words only.
aliases:
  Atlas Sport Cross: Atlas Cross Sport   # VW model export: 2020-2023 Atlas Cross Sport records
  GTI: Golf GTI                          # accessory file names the Golf GTI "GTI". Only the word GTI is rewritten;
                                         # "Golf" alone stays the base Golf. "Golf GTI ..." -> "Golf Golf GTI ..." ->
                                         # repeated word removed -> unchanged
