# ============================================================================
# File: accy_v2/oems/mazda/config/schemas/upstream.yaml
# Description: Incoming CSV file structure and validation rules
# OEM: Mazda
# Purpose: Defines how to detect, validate, and rename columns from raw CSV
# ============================================================================
# DECISION [022]: Substring-based keyword matching for PascalCase headers
# Mazda CSV uses PascalCase (ModelYear, PartNumber, AccessoryName) with no underscores
# Keywords are matched as substrings, not as underscore-delimited tokens
# ============================================================================

# Required languages for this OEM
# Mazda requires both English and French columns
languages:
  - EN
  - FR

# Column detection and validation rules
# Each column defined here with keyword detection, types, and completeness thresholds
# All keywords are matched as substrings in the lowercased column name
columns:
  year_from:
    # Keywords to detect this column in header row
    detect_by_keyword:
      must_have: [year]
      must_have_one_of: []
      must_not_have: [carline, parts, parts]
    required: true
    rename_to_canonical: ModelYear
    expected_data_type: integer
    completeness_threshold: 1.0
    description: "Model year from ModelYear column (e.g., 2024, 2025)"

  model_name:
    detect_by_keyword:
      must_have: [carline]
      must_have_one_of: []
      must_not_have: []
    required: true
    rename_to_canonical: ModelName
    expected_data_type: string
    completeness_threshold: 1.0
    description: "Vehicle model/carline from CarLineCode column (e.g., MX30, CX-5)"

  part_number:
    detect_by_keyword:
      must_have: [part, number]
      must_have_one_of: []
      must_not_have: [id]
    required: true
    rename_to_canonical: PartNumber
    expected_data_type: string
    completeness_threshold: 1.0
    transformation: uppercase
    description: "Accessory part number from PartNumber column (e.g., MAZ123456)"

  model_number:
    detect_by_keyword:
      must_have: [trim, level]
      must_have_one_of: []
      must_not_have: []
    required: true
    rename_to_canonical: model_number
    expected_data_type: string
    completeness_threshold: 1.0
    description: "Model/trim code from TrimLevel column (10 chars: 6-char trim code + 4-char package code)"

  english_description:
    detect_by_keyword:
      must_have: [accessoryname]
      must_have_one_of: []
      must_not_have: [fr]
    required: true
    rename_to_canonical: Description
    expected_data_type: string
    completeness_threshold: 1.0
    language: EN
    description: "English accessory description from AccessoryName column"

  french_description:
    detect_by_keyword:
      must_have: [accessoryname, fr]
      must_have_one_of: []
      must_not_have: []
    required: true
    rename_to_canonical: Description_FR
    expected_data_type: string
    completeness_threshold: 1.0
    language: FR
    description: "French accessory description from AccessoryNameFR column"

  msrp:
    detect_by_keyword:
      must_have: [msrp]
      must_have_one_of: []
      must_not_have: []
    required: true
    rename_to_canonical: MSRP
    expected_data_type: float
    completeness_threshold: 1.0
    description: "Manufacturer Suggested Retail Price from MSRP column"

  labour_hours:
    detect_by_keyword:
      must_have: [standard, install, time]
      must_have_one_of: []
      must_not_have: []
    required: true
    rename_to_canonical: LaborHours
    expected_data_type: float
    completeness_threshold: 1.0
    description: "Installation time from StandardInstallTime column (units to be confirmed with business)"

  comments_en:
    detect_by_keyword:
      must_have: [restriction, en]
      must_have_one_of: []
      must_not_have: []
    required: false
    rename_to_canonical: Comments
    expected_data_type: string
    completeness_threshold: 0.0
    language: EN
    description: "English restrictions/comments from RestrictionEn"

  comments_fr:
    detect_by_keyword:
      must_have: [restriction, fr]
      must_have_one_of: []
      must_not_have: []
    required: false
    rename_to_canonical: Comments_FR
    expected_data_type: string
    completeness_threshold: 0.0
    language: FR
    description: "French restrictions/comments from RestrictionFr"

# Sheet-level validation rules
sheet_validation:
  # Pattern to match valid sheet names (regex)
  # .* accepts all sheets (no filtering)
  sheet_name_pattern: ".*"

  # Sheets to explicitly exclude (empty = no exclusions)
  exclude_sheet_names: []

  # Trim table detection (for future use if Mazda sheets have trim applicability)
  trim_table:
    column_pattern: "^trim"
    required: false
    detection_method: contains_pattern
    description: "Trim level columns (if present)"

# Completeness validation gates
validation_gates:
  # Minimum fraction of columns that must be detected (0.0 - 1.0)
  column_detection_threshold: 0.8

  # Minimum number of data rows (after header detection)
  minimum_data_rows: 1

  # Behavior on incomplete data: fail, warn, skip_sheet
  on_incomplete_data: warn
