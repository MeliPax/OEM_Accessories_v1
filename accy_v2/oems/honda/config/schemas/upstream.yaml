# Honda Upstream Schema - Column Specifications & Language-Specific Detection
# Defines the raw data structure and how to identify columns in Honda Excel files
# This is the PRIMARY schema file for column definitions and detection rules

# ============================================================================
# File Structure
# ============================================================================

file:
  format: "Excel"
  extension: ".xlsx"
  encoding: "UTF-8"

# ============================================================================
# Metadata Rows (Rows 0-9)
# ============================================================================

metadata_rows:
  model_row: 1 # "Model Name" label in column A, value in column B
  year_row: 2 # "Model Year" label in column A, value in column B
  legend_rows: [3, 4, 5, 6, 7, 8] # Legend entries (optional, informational)
  publication_date_row: 9 # May contain publication date

  # Expected metadata fields
  expected_fields:
    - field: "Model Name"
      location: "row 1, column B"
      required: true
      example: "Civic Hatch & Type R"

    - field: "Model Year"
      location: "row 2, column B"
      required: true
      example: "2026"

# ============================================================================
# Sheet Patterns
# ============================================================================

sheets:
  data_sheet:
    name_pattern: "*_DATA"
    purpose: "Metadata only (not processed by pipeline)"
    processing: "SKIP"

  en_sheet:
    name_pattern: "*_APP_EN"
    purpose: "English product data with section-based layout"
    processing: "PROCESS"
    language: "EN"
    header_row: "null" # No header row in raw file; headers are inside sections

  fr_sheet:
    name_pattern: "*_APP_FR"
    purpose: "French product data with section-based layout"
    processing: "PROCESS"
    language: "FR"
    header_row: "null" # No header row in raw file; headers are inside sections

  sell_sheet:
    name_pattern: "*SELL*"
    purpose: "Sales/summary view (not processed)"
    processing: "SKIP"

  select_province_sheet:
    name_pattern: "*SELECT PROVINCE*"
    purpose: "Province selector (not processed)"
    processing: "SKIP"

# ============================================================================
# Section Structure (Rows 10+)
# ============================================================================

sections:
  marker_pattern: "^\\d+\\.\\d+\\s+(.+)$"
  marker_examples:
    - "1.0 Packages and Kits"
    - "2.0 Wheels and Wheel Accessories"
    - "3.0 Exterior"
    - "4.0 Interior"
    - "5.0 Electrical"
    - "6.0 Paint Pens"

  # Section structure (conceptual, actual row positions detected dynamically)
  header_structure:
    - name: "section_marker"
      content: "Section identifier (pattern: \\d+\\.\\d+\\s+NameOfSection)"
      detection: "See structure.yaml for regex pattern and scanning logic"

    - name: "header_row"
      content: "Column names (Description, Part Number, Cost, Trim Applicability, etc.)"
      detection: "First row after marker containing column name keywords (see structure.yaml)"
      example: "Unnamed: 0 = NaN, Unnamed: 1 = Description, Unnamed: 2 = Part Number, ..."

    - name: "trim_sub_header_row"
      content: "Trim level names and applicability markers (e.g., 'SPORT', 'Type R', or '•', 'T', 'E')"
      detection: "Row after header containing applicability markers in trim columns (see structure.yaml)"
      characteristics:
        - "row immediately after product column headers"
        - "contains actual trim values (not keywords, not empty)"
        - "text format, not numeric"
      example: "Row with trim names like 'SPORT', 'Type R', or applicability markers '•', 'T', 'E'"

    - name: "data_rows"
      content: "Actual product data (one row per product/accessory)"
      detection: "Rows after trim sub-header, until next section marker or end of sheet"
      structure:
        - "First columns contain product identification (part number, description)"
        - "Middle columns contain pricing/cost information"
        - "Remaining columns contain applicability markers for each trim"

# ============================================================================
# COLUMN DEFINITIONS with LANGUAGE-SPECIFIC DETECTION
# ============================================================================
# Each column has EN and FR keyword rules for robust, position-independent matching
# Keywords: must_have (ALL must be present), must_have_one_of (at least ONE), not_have (NONE)
# Matching: case-insensitive, accent-normalized, substring-based

columns:
  description:
    type: "string"
    required: true
    standardized_name: "description"
    examples: ["Racing Package - Type R", "Platinum White Pearl (NH-883P)"]
    detection:
      EN:
        key_words:
          must_have: [description]
          must_have_one_of: []
          not_have: []
      FR:
        key_words:
          must_have: [description]
          must_have_one_of: [la]
          not_have: []

  part_number:
    type: "string"
    required: true
    standardized_name: "part_number"
    examples: ["26TYPER-RACE", "TUCH-NH883P-A1"]
    detection:
      EN:
        key_words:
          must_have: [part]
          must_have_one_of: [number, '#']
          not_have: [description]
      FR:
        key_words:
          must_have: []
          must_have_one_of: [numéro, numero, pièce, piece]
          not_have: [description]

  dealer_net:
    type: "float"
    required: false
    standardized_name: "dealer_net"
    alt_names: ["Dealer Net", "DNP"]
    examples: [3928, 13.25]
    detection:
      EN:
        key_words:
          must_have: [net]
          must_have_one_of: [dealer]
          not_have: []
      FR:
        key_words:
          must_have: [net]
          must_have_one_of: [prix]
          not_have: []

  list_price:
    type: "float"
    required: false
    standardized_name: "list_price"
    alt_names: ["List Price", "MSRP", "Retail Price"]
    examples: [6612, 22]
    detection:
      EN:
        key_words:
          must_have: [list]
          must_have_one_of: [price]
          not_have: []
      FR:
        key_words:
          must_have: [liste]
          must_have_one_of: [prix, tarif]
          not_have: []

  frt:
    type: "float"
    required: false
    standardized_name: "frt"
    examples: [0.9999999999999999, 0]
    detection:
      EN:
        key_words:
          must_have: [frt]
          must_have_one_of: []
          not_have: []
      FR:
        key_words:
          must_have: []
          must_have_one_of: [tff, t.f.f., freight]
          not_have: []

  installed_price:
    type: "float"
    required: false
    standardized_name: "installed_price"
    examples: [6612, 22]
    detection:
      EN:
        key_words:
          must_have: [install]
          must_have_one_of: [price]
          not_have: []
      FR:
        key_words:
          must_have: [install]
          must_have_one_of: [prix]
          not_have: []

  application:
    type: "string"
    required: false
    standardized_name: "application"
    examples: ["All Trims"]
    detection:
      EN:
        key_words:
          must_have: [application]
          must_have_one_of: []
          not_have: []
      FR:
        key_words:
          must_have: [application]
          must_have_one_of: []
          not_have: []

  comments:
    type: "string"
    required: false
    standardized_name: "comments"
    examples: ["Quantity of 5", "Quantity of 25"]
    detection:
      EN:
        key_words:
          must_have: [comment]
          must_have_one_of: [remark, note]
          not_have: []
      FR:
        key_words:
          must_have: [comment]
          must_have_one_of: [remarque, remarques, note]
          not_have: []

# ============================================================================
# Column Categories
# ============================================================================

column_categories:
  product_columns:
    - "part_number"
    - "description"
  price_columns:
    - "dealer_net"
    - "list_price"
    - "frt"
    - "installed_price"
  trim_columns: []  # Auto-detected

# ============================================================================
# Data Quality Expectations
# ============================================================================

data_quality:
  # Expected data ranges
  row_counts:
    total_rows_per_sheet: "~150-170"
    rows_per_section: "~10-50"
    min_non_empty_rows: 1

  # Column value patterns
  part_number_pattern: "^[A-Z0-9\\-]+$"

  # Missing data tolerance
  non_null_threshold:
    required_columns: 1 # At least 90% non-null
    optional_columns: 0.3 # At least 50% non-null

  # Known anomalies
  known_issues:
    - issue: "Newlines in column headers"
      example: "SPORT \\nHybrid"
      mitigation: "Strip/replace newlines during header extraction"

    - issue: "Empty rows between sections"
      example: "Row with all NaN values"
      mitigation: "Filter empty rows, don't count them as data"

    - issue: "Publication date rows at end"
      example: "Last 2-3 rows contain 'Publication Date:' metadata"
      mitigation: "Filter out rows after last section data ends"
