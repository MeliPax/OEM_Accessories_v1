# Honda Pipeline Configuration
#
# High-level orchestration settings, error handling, and batch processing behavior.
#
# Will be updated in Phase 3 with actual error thresholds and batch settings.

# Feature Flags
features:
  use_model_lookup: true                # Enrich with VehicleSearchEngine
  enable_en_fr_reconciliation: true     # Separate sheets + merge
  enable_rollup_logic: true             # Parent-child aggregation
  enable_batch_processing: true         # Multi-file directory orchestration

# Error Handling Strategy
# FATAL: Stops processing immediately for this file
# WARNING: Logs warning, continues processing
# QUARANTINE: File marked for review, logs warning, continues batch
error_handling:
  FATAL:
    - missing_section                   # Required section not found
    - encoding_error                    # File encoding issue
    - file_not_readable                 # Excel file corrupted

  WARNING:
    - trim_parsing_error                # Applicability marker not recognized
    - cost_mismatch                     # EN/FR cost divergence > threshold
    - part_number_divergence            # EN/FR part numbers don't match
    - section_order_divergence          # Sections out of order
    - missing_column                    # Expected column not found

  # Batch-level quarantine
  quarantine:
    enabled: true
    threshold: 0.10                     # Quarantine file if >10% errors
    action: "log_and_skip"              # Log warning and skip file

# Batch Processing Settings
batch_settings:
  # Directory scanning pattern (relative to landing_zone/honda/)
  scan_pattern: "**/*.xlsx"             # Recursive scan for Excel files
  
  # Publication date extraction
  publication_date_extraction: true     # Extract from file headers if present
  publication_date_columns:
    - "Publication Date"
    - "Date de publication"
    - "Release Date"
    - "Date de sortie"
  
  # Single-model-per-file handling
  # Honda files typically contain one model per file (unlike Hyundai's master sheet)
  single_model_per_file: true
  model_name_from: "config"             # Extract from filename or config
  
  # Batch aggregation
  aggregation:
    enabled: true
    output_format: "json"               # batch_summary_dq.json
    aggregate_metrics:
      - files_processed
      - files_failed
      - total_rows_processed
      - total_rows_output
      - reconciliation_success_rate
      - model_lookup_success_rate

# Output Settings
output:
  # Output directory (relative to project root)
  output_dir: "output/"
  
  # Sheet names for Excel output
  sheets:
    main: "Accessories"                 # Main data sheet
    raw_data: "raw_data"                # EN/FR merge audit trail
    confidence: "Confidence"            # Quality metrics
    dq_report: "DQ Report"              # Data quality issues
  
  # Language-specific outputs
  languages:
    - EN
    - FR

# Logging
logging:
  pipeline_log_level: "INFO"            # DEBUG, INFO, WARNING, ERROR
  dq_log_level: "INFO"
  
  # Log output locations
  pipeline_logs_dir: "output/pipeline_logs/"
  dq_reports_dir: "output/dq_reports/"
