# ============================================================================
# File: accy_v2/oems/honda/config/reconciliation.yaml
# Purpose: Define EN/FR reconciliation strategy and divergence handling
# Status: Phase 3 Configuration
# Key Decision: Same priority for both EN and FR; divergent rows INCLUDED in output (not excluded)
# ============================================================================

# Sheet Pattern Matching
# Identify EN and FR sheets in Excel files
sheet_patterns:
  english_sheet_pattern: "*_APP_EN"     # e.g., 26MY_ACCORD_APP_EN
  french_sheet_pattern: "*_APP_FR"      # e.g., 26MY_ACCORD_APP_FR

  # If both sheets not found: FATAL error (fail file)
  require_both_sheets: true

# ============================================================================
# Composite Part Number Normalization
# ============================================================================
# Honda part numbers may have alternatives: "50977-565-45BH or 50977-565-45SH"
# Strategy: LEFT-PRIORITY for both EN and FR (ensures same result)

composite_part_number:
  enabled: true
  strategy: "left"                      # Prioritize left side of separator

  # Separator keywords (case-insensitive)
  separators:
    en: ["or"]                          # English: "or"
    fr: ["ou"]                          # French: "ou"

  # Normalization options
  normalization:
    strip_whitespace: true              # Remove leading/trailing spaces
    preserve_case: true                 # Keep original case (important for part numbers)
    fallback_to_right: true             # If left is empty, use right side

# ============================================================================
# Matching & Reconciliation Strategy
# ============================================================================
# Goal: Create reconciliation map linking EN and FR records
# Matching occurs on multiple criteria with priority levels

matching_strategy:

  # Primary match: Composite part number (normalized)
  part_number_match:
    required: true                      # Must have matching part numbers
    method: "composite_normalized"      # Use composite part normalization
    confidence_weight: 1.0              # Exact match = 100% confidence

  # Secondary match: Cost/pricing
  cost_match:
    enabled: true
    fields:
      - "Dealer Net"                    # EN: "Dealer Net" / FR: "Prix net"
      - "List Price"                    # EN: "List Price" / FR: "Prix de liste"
      - "FRT"                           # EN: "FRT" / FR: "T.F.F."
    method: "exact_match"               # Cost must match EXACTLY (zero tolerance)
    tolerance_percent: 0                # Zero tolerance for cost divergence
    severity_on_divergence: "ERROR"     # Cost divergence is ERROR, not warning

  # Tertiary match: Trim applicability
  trim_match:
    enabled: false                      # Optional, checked after match
    description: "Verify EN/FR trims are consistent"

  # Quaternary match: Description
  description_match:
    enabled: false                      # Optional, checked after match
    method: "semantic"                  # EN and FR naturally differ; not a matching criterion

# ============================================================================
# Divergence Detection & Reporting
# ============================================================================
# When EN/FR records have discrepancies, mark with divergence type and include in output

divergence_types:

  # Cost Divergence (highest severity)
  cost_divergence:
    enabled: true
    fields:
      - "List Price"
      - "Dealer Net"
      - "FRT"
      - "Installed Price"
    check: "exact_match"
    tolerance_percent: 0                # Zero tolerance
    severity: "ERROR"                   # Cost divergence is ERROR
    action: "include_in_output"         # Include row, mark with divergence flag
    dq_rule: "cost_mismatch_rule"
    merge_confidence_penalty: 0.25      # Reduce merge_confidence by 25%

  # Part Number Divergence
  part_number_divergence:
    enabled: true
    check: "after_composite_normalization"
    severity: "WARNING"                 # Part number divergence is warning (may be translation)
    action: "include_in_output"
    dq_rule: "part_number_divergence_rule"
    merge_confidence_penalty: 0.15      # Reduce merge_confidence by 15%

  # Description Divergence
  description_divergence:
    enabled: true
    check: "language_aware"             # EN and FR naturally differ
    severity: "INFO"                    # Just informational
    action: "include_in_output"
    dq_rule: "description_divergence_rule"
    merge_confidence_penalty: 0.0       # No penalty (expected)

  # Trim Applicability Divergence
  trim_divergence:
    enabled: true
    check: "exact_match"                # Trim applicability must match EN/FR
    severity: "WARNING"                 # Flag if children trims diverge from parent
    action: "include_in_output"
    dq_rule: "trim_applicability_divergence_rule"
    merge_confidence_penalty: 0.10      # Reduce merge_confidence by 10%

# ============================================================================
# Reconciliation Map Output
# ============================================================================
# Metadata stored after reconciliation for downstream steps

reconciliation_metadata:
  # Status of the EN/FR match
  reconciliation_status:                # MAPPED | EN_ONLY | FR_ONLY | DIVERGED
    field_name: "reconciliation_status"
    description: "Result of EN/FR reconciliation"

  # Quality metrics for this row
  cost_match:
    field_name: "cost_match"
    type: "boolean"
    description: "True if EN and FR costs match exactly"

  part_count_match:
    field_name: "part_count_match"
    type: "boolean"
    description: "True if EN and FR have same number of parts"

  merge_confidence:
    field_name: "merge_confidence"
    type: "float (0.0-1.0)"
    description: "Confidence score for EN/FR merge (starts at 1.0, reduced by divergences)"

  divergence_flags:
    field_name: "divergence_flags"
    type: "list"
    description: "List of divergence types detected (cost_divergence, part_number_divergence, etc.)"

  dq_warnings:
    field_name: "dq_warnings"
    type: "list"
    description: "List of DQ rule violations for this row"

# ============================================================================
# Output Behavior
# ============================================================================

output_behavior:
  # Include divergent rows in output Excel workbook?
  include_divergent_rows: true          # YES: include all rows, mark divergence

  # Output format
  output_structure:
    main_sheet: "Accessories"           # Primary output (all rows, including divergent)
    raw_data_sheet: "raw_data"          # Source data before reconciliation
    confidence_sheet: "Confidence"      # Merge confidence scores and divergence details
    dq_sheet: "DQ Report"               # Data quality issues

  # Visibility of divergent rows
  row_filtering:
    # Main sheet: include all (user filters if needed)
    main_include: "all"                 # ALL rows (no filtering)
    main_highlight: "divergent_rows"    # Highlight rows with divergences

    # Raw data sheet: full audit trail
    raw_data_include: "all"             # All EN/FR values before reconciliation

    # Confidence sheet: detailed metrics
    confidence_sheet_include: "all"     # All confidence scores and penalties

# ============================================================================
# Metadata
# ============================================================================

metadata:
  version: "1.0"
  created: "2026-09-24"
  strategy: "Include divergent rows, mark confidence, report in DQ"
  critical_notes:
    - "Cost divergence (List Price, Dealer Net, FRT) = ZERO tolerance = ERROR"
    - "Same priority for EN and FR (not separate rules)"
    - "Divergent rows included in output (not excluded) with merge_confidence score"
    - "Raw data sheet shows full EN/FR audit trail before reconciliation"
