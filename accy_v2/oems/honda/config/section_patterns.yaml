# ============================================================================
# File: accy_v2/oems/honda/config/section_patterns.yaml
# Purpose: Define Honda accessory section structure and detection patterns
# Status: Phase 3 Configuration (Confirmed from sample files)
# Verified: Accord, Civic 4D, Civic 5D, CR-V, Pilot (all models have same 6 sections)
# ============================================================================

# IMPORTANT: Section structure is IDENTICAL across all Honda models
# Any model in any year has exactly these 6 sections in this order
# Verified across: Accord, Civic 4D, Civic 5D, CR-V, Odyssey, Pilot, Prologue, Passport, Ridgeline

sections:

  packages:
    number: 1
    en: "1.0 Packages and Kits"
    fr: "1.0 Groupes et ensembles"
    description: "Package deals and accessory kits (bundled accessories)"

  wheels:
    number: 2
    en: "2.0 Wheels and Wheel Accessories"
    fr: "2.0 Jantes et accessoires de jantes"
    description: "Wheel sets, tires, wheel locks, tire covers"

  exterior:
    number: 3
    en: "3.0 Exterior"
    fr: "3.0 Extérieur"
    description: "Exterior trim, deflectors, emblems, protective films"

  interior:
    number: 4
    en: "4.0 Interior"
    fr: "4.0 Intérieur"
    description: "Interior mats, seat covers, cargo organizers"

  electrical:
    number: 5
    en: "5.0 Electrical"
    fr: "5.0 Électrique"
    description: "Electrical accessories (chargers, heated seats, etc.)"

  paint_pens:
    number: 6
    en: "6.0 Paint Pens"
    fr: "6.0 Stylos à peinture"
    description: "Touch-up paint pens and paint supplies"

# Section Order
# Sections must appear in this exact order (1-6)
section_order:
  - packages
  - wheels
  - exterior
  - interior
  - electrical
  - paint_pens

# Expected Column Headers per Section
# Used to validate section structure
# Columns are defined with both original names and canonical mappings
column_headers:
  en:
    - name: "Description"
      canonical: "description"
      is_numeric: false
    - name: "Part Number"
      canonical: "part_number"
      is_numeric: false
    - name: "Dealer Net"
      canonical: "dealer_net"
      is_numeric: true
    - name: "List Price"
      canonical: "list_price"
      is_numeric: true
    - name: "FRT"
      canonical: "frt"
      is_numeric: true
    - name: "Installed Price"
      canonical: "installed_price"
      is_numeric: true
    # Trim columns follow after Installed Price (variable per section)

  fr:
    - name: "La description"
      canonical: "description"
      is_numeric: false
    - name: "Numéro de pièce"
      canonical: "part_number"
      is_numeric: false
    - name: "Prix net"
      canonical: "dealer_net"
      is_numeric: true
    - name: "Prix de liste"
      canonical: "list_price"
      is_numeric: true
    - name: "T.F.F."
      canonical: "frt"
      is_numeric: true
    - name: "Prix installé"
      canonical: "installed_price"
      is_numeric: true
    # Trim columns follow after Prix installé (variable per section)

# Trim extraction settings
trim_extraction:
  # Column after which trim columns begin
  price_column_canonical: "installed_price"  # Use canonical name for language-agnostic reference
  price_column_en: "Installed Price"
  price_column_fr: "Prix installé"

  # Stop markers: trim extraction stops when hitting these
  stop_markers:
    en: ["application", "notes", "remarks", ""]
    fr: ["application", "notes", "remarques", ""]

  # Marker matching behavior
  case_insensitive: true
  strip_whitespace: true

# DQ Validation Rules
validation:
  # All 6 sections must be present
  require_all_sections: true

  # Sections must appear in order (1.0 before 2.0, etc.)
  enforce_section_order: true

  # If section missing: FATAL error (fail file)
  missing_section_severity: "FATAL"

  # If section out of order: WARNING (log, continue)
  out_of_order_severity: "WARNING"

# Metadata
metadata:
  version: "1.0"
  created: "2026-09-24"
  verified_against: "Accord, Civic 4D, Civic 5D, CR-V, Pilot (2026 model year files)"
  notes: "Section structure is consistent across all Honda models and model years"
