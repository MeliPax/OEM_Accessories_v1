# ============================================================================
# File: accy_v2/oems/honda/config/transformations.yaml
# Description: Data cleaning and standardization rules for Honda
# OEM: Honda
# Purpose: Defines all transformations applied to each column post-ingestion
# Based on: Honda-specific operations
# ============================================================================

# Per-column transformation pipelines
# Order matters: operations are applied sequentially to each column
# Each column gets its own cleaning, standardization, and validation pipeline

columns:
  # ========================================================================
  # METADATA COLUMNS
  # ========================================================================

  model_name:
    operations:
      - name: trim_whitespace
        description: "Remove leading/trailing whitespace"
      - name: standardize_case
        format: title_case
        description: "Convert to Title Case (Civic Hatch, Civic Type R, etc.)"
    validation:
      nullable: false

  model_year:
    operations:
      - name: ensure_integer
        description: "Convert to integer type"
      - name: validate_range
        min_value: 2020
        max_value: 2100
        description: "Year must be within valid production range"
    validation:
      nullable: false

  # ========================================================================
  # PART IDENTIFICATION COLUMNS
  # ========================================================================

  part_number:
    operations:
      - name: normalize_unicode
        description: "Convert smart quotes and unicode chars to ASCII"
        from_chars: [''', ''', '"', '"', '…']
        to_chars: ["'", "'", '"', '"', "..."]
      - name: split_composite
        description: "Handle 'part1 or part2' syntax (keep first, note in comments)"
        delimiter: " or "
        delimiter_fr: " ou "
        action: "keep_first_priority_left"
        note_field: "comments"
      - name: uppercase
        description: "Convert to uppercase for part number consistency"
      - name: trim_whitespace
        description: "Remove extra whitespace"
    validation:
      nullable: false
      pattern: "^[A-Z0-9\\-]+$"
      minimum_length: 3

  # ========================================================================
  # DESCRIPTION COLUMNS (MAIN CLEANING)
  # ========================================================================

  description:
    operations:
      - name: normalize_unicode
        description: "Convert smart quotes and unicode to ASCII equivalents"
        from_chars: [''', ''', '"', '"', '…', '–', '—']
        to_chars: ["'", "'", '"', '"', "...", "-", "-"]
      - name: remove_newlines
        description: "Strip literal \\n from descriptions (Excel multi-line cells)"
        replace_with: " "
        collapse_multiple_spaces: true
      - name: trim_whitespace
        description: "Remove leading/trailing whitespace"
      - name: standardize_case
        format: title_case
        description: "Convert to Title Case (Racing Package, Type R, etc.)"
      - name: standardize_abbreviations
        config_file: "${MODEL_LOOKUP_CONFIGS}/honda/translator.yaml"
        description: "Convert abbreviations (HEV→Hybrid, AWD→All-Wheel Drive, etc.)"
      - name: deduplicate_words
        description: "Remove duplicate adjacent words (Hybrid Hybrid→Hybrid)"
      - name: remove_markup
        markup_tags: ["(EN)", "(FR)"]
        description: "Remove language markers"
    validation:
      nullable: false
      minimum_length: 5

  description_fr:
    operations:
      - name: normalize_unicode
        from_chars: [''', ''', '"', '"', '…', '–', '—']
        to_chars: ["'", "'", '"', '"', "...", "-", "-"]
      - name: remove_newlines
        replace_with: " "
        collapse_multiple_spaces: true
      - name: trim_whitespace
      - name: standardize_case
        format: title_case
      - name: standardize_abbreviations
        config_file: "${MODEL_LOOKUP_CONFIGS}/honda/translator.yaml"
      - name: deduplicate_words
      - name: remove_markup
        markup_tags: ["(EN)", "(FR)"]
    validation:
      nullable: true  # FR may not be present for all rows
      minimum_length: 5

  # ========================================================================
  # PRICING COLUMNS
  # ========================================================================

  dealer_net:
    operations:
      - name: convert_to_float
        description: "Convert to float type"
      - name: remove_currency_symbols
        symbols: ["$", "CAD", "USD", "¥", "€"]
      - name: validate_range
        min_value: 0
        max_value: 50000
        description: "Dealer net should be reasonable for Honda accessories"
    validation:
      nullable: true

  list_price:
    operations:
      - name: convert_to_float
      - name: remove_currency_symbols
        symbols: ["$", "CAD", "USD", "¥", "€"]
      - name: validate_range
        min_value: 0
        max_value: 50000
        description: "List price should be reasonable for Honda accessories"
    validation:
      nullable: true

  frt:
    operations:
      - name: convert_to_float
      - name: validate_range
        min_value: 0
        max_value: 10
        description: "FRT (freight) should be small decimal"
    validation:
      nullable: true

  installed_price:
    operations:
      - name: convert_to_float
      - name: remove_currency_symbols
        symbols: ["$", "CAD", "USD", "¥", "€"]
      - name: validate_range
        min_value: 0
        max_value: 50000
    validation:
      nullable: true

  # ========================================================================
  # TRIM APPLICABILITY COLUMNS
  # ========================================================================
  # Honda uses special markers: • (bullet), S (standard), T (tire change), E (exchange)
  # Also contains 0, 0.0, empty string, "N/A" as placeholders

  trim_columns:
    operations:
      - name: normalize_trim_markers
        description: "Map special characters and placeholders to canonical states"
        mapping:
          "•": "applicable"           # Bullet = applicable
          "✓": "applicable"           # Checkmark = applicable
          "S": "standard"             # Standard (comes with this trim)
          "T": "tire_change"          # Tire size change
          "E": "exchange"             # Exchange (same size as OE)
          "0": null                   # Placeholder = empty
          "0.0": null                 # Placeholder = empty
          "": null                    # Empty string
          "N/A": null                 # Not applicable
      - name: trim_whitespace
        description: "Strip whitespace from non-placeholder values"
    validation:
      nullable: true  # Trim columns can be empty
      allowed_values: ["applicable", "standard", "tire_change", "exchange", null]

  # ========================================================================
  # COMMENTS/NOTES COLUMNS
  # ========================================================================

  comments:
    operations:
      - name: normalize_unicode
        from_chars: [''', ''', '"', '"', '…']
        to_chars: ["'", "'", '"', '"', "..."]
      - name: remove_newlines
        replace_with: " "
        collapse_multiple_spaces: true
      - name: normalize_whitespace
        collapse_multiple_spaces: true
        description: "Collapse multiple spaces into single space"
      - name: trim_whitespace
    validation:
      nullable: true
      minimum_length: 5

  comments_fr:
    operations:
      - name: normalize_unicode
        from_chars: [''', ''', '"', '"', '…']
        to_chars: ["'", "'", '"', '"', "..."]
      - name: remove_newlines
        replace_with: " "
        collapse_multiple_spaces: true
      - name: normalize_whitespace
        collapse_multiple_spaces: true
      - name: trim_whitespace
    validation:
      nullable: true
      minimum_length: 5

  # ========================================================================
  # APPLICATION/NOTES COLUMNS (Optional)
  # ========================================================================

  application:
    operations:
      - name: trim_whitespace
      - name: standardize_case
        format: title_case
    validation:
      nullable: true
      minimum_length: 3

# ============================================================================
# GLOBAL TRANSFORMATION SETTINGS
# ============================================================================

global:
  # Handle missing values during transformation
  missing_value_strategy:
    empty_string: "treat_as_null"
    "N/A": "treat_as_null"
    "NA": "treat_as_null"
    "n/a": "treat_as_null"
    "n/a ": "treat_as_null"
    "-": "treat_as_null"
    "--": "treat_as_null"
    "---": "treat_as_null"

  # Log all transformation details for audit trail
  log_transformations: true

  # Unicode normalization settings
  unicode_normalization:
    enabled: true
    normalize_form: "NFC"  # Canonical decomposition
    description: "Normalize unicode to NFC form for consistent matching"

  # Error handling strategy
  error_handling:
    type_coercion_errors: "raise"  # Fail on type conversion errors
    range_validation_errors: "log_warning"  # Log but continue on range violations

# ============================================================================
# HONDA-SPECIFIC OPERATIONS REFERENCE
# ============================================================================
# These operations are extensions beyond the Hyundai pattern:
#
# 1. normalize_unicode
#    - Input: Smart quotes (U+201C, U+201D), unicode spaces (U+00A0)
#    - Output: ASCII equivalents (", ', space)
#    - Applied to: part_number, description, comments
#    - Why: Avoid encoding issues in downstream tools
#
# 2. remove_newlines
#    - Input: Literal \n in Excel multi-line cells
#    - Output: Single line with space replacement
#    - Applied to: description, comments
#    - Why: Excel sometimes stores cells with newlines; causes parsing issues
#
# 3. split_composite
#    - Input: "part1 or part2" syntax (Honda uses this for variants)
#    - Output: Keep "part1", append note to comments
#    - Applied to: part_number only
#    - Why: Part matching requires single canonical part number
#
# 4. normalize_trim_markers
#    - Input: Special chars (•, ✓, S, T, E) + placeholders (0, 0.0, "", N/A)
#    - Output: Canonical states (applicable, standard, tire_change, exchange, null)
#    - Applied to: All trim columns
#    - Why: Distinguish real trim values from placeholder markers
#
# ============================================================================
